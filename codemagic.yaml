workflows:
  ios-release:
    name: Build & Publish Sanad 2025 iOS
    max_build_duration: 60
    environment:
      os: macos          # مهم جداً، لأنه iOS فقط على macOS
      flutter: stable
      xcode: latest
      groups:
        - appstore_credentials
        - ios_config

    scripts:
      - name: تثبيت الحزم
        script: |
          flutter pub get

      - name: إنشاء ملف App Store Connect Key من Base64
        script: |
          echo $APP_STORE_CONNECT_PRIVATE_KEY | base64 --decode > AuthKey.p8

      - name: Build iOS Release
        script: |
          flutter build ios --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: AuthKey.p8
        key_id: ${APP_STORE_CONNECT_KEY_IDENTIFIER}
        issuer_id: ${APP_STORE_CONNECT_ISSUER_ID}

    code_signing:
      ios:
        distribution_method: app_store
        automatic_signing: true
        team_id: ${APPLE_TEAM_ID}   # ضع هنا Apple Developer Team ID الخاص بك
        bundle_id: ${BUNDLE_ID}     # com.sanad.edu
